name: Offline Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      APCA_API_KEY_ID: ""
      APCA_API_SECRET_KEY: ""
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      CONFIRM_LIVE_TRADING: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Validate AI customization
        run: python scripts/validate_ai_setup.py
      - name: Test safety hook policy
        shell: powershell
        run: ./scripts/test_agent_guard.ps1
      - name: Run isolated offline regression suite
        run: python scripts/offline_tests.py
      - name: Check whitespace
        run: git diff --check